name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main # или master, в зависимости от вашей главной ветки

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20

      - name: Install dependencies
        run: npm ci

      - name: Build React App
        run: npm run build
        env:
          NODE_OPTIONS: "--openssl-legacy-provider" # Добавлено для совместимости со старыми сборками CRA

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build' # Папка, куда CRA собирает проект

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
