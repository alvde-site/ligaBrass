<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Лига Брасс</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages [1.12]
      // MIT License [1.12]
      // https://github.com/rafgraph/spa-github-pages [1.12]

      // ИСПРАВЛЕНИЕ: Для личного домена ligabrass.ru строго фиксируем 0
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
