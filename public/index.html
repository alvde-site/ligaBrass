<!DOCTYPE html>
<html lang="ru">
  <head>
    <!-- Базовый URL для абсолютного роутинга глубоких страниц музыкантов -->
    <base href="/" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Основные метатеги поисковой оптимизации (SEO) -->
    <meta name="title" content="Лига Брасс — Ансамбль медных духовых инструментов" />
    <meta name="description" content="Официальный сайт творческого коллектива Лига Брасс. Ансамбль солистов, представляющий классический состав медных духовых инструментов и академический музыкальный репертуар." />
    <meta name="keywords" content="лига брасс, брасс квинтет, медные духовые инструменты, ансамбль солистов, духовой квинтет, академическая музыка, концертные программы, труба, тромбон, валторна, туба, живая музыка на концерт" />
    <meta name="author" content="Лига Брасс" />
    <meta name="application-name" content="Лига Брасс" />

    <!-- Глобальная разметка Open Graph (OG) для красивого превью ссылок в Telegram, WhatsApp и VK -->
    <meta property="og:title" content="Лига Брасс — Ансамбль медных духовых инструментов" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Официальный сайт творческого коллектива. Хроника событий, архив концертов, репертуарные программы и медиагалерея." />
    <meta property="og:image" content="%PUBLIC_URL%/icons/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Лига Брасс" />

    <!-- Современный пакет иконок для всех устройств (адаптирован под папку /icons/) -->
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/icons/favicon.svg" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Лига Брасс" />
    <link rel="manifest" href="%PUBLIC_URL%/icons/site.webmanifest" />
    
    <!-- Веб-манифест PWA-приложения -->
    <link rel="manifest" href="%PUBLIC_URL%/icons/site.webmanifest" />
    <meta name="msapplication-TileColor" content="#1A1F2C">
    <meta name="msapplication-TileImage" content="%PUBLIC_URL%/icons/ms-icon-144x144.png">

    <!-- Тонирование строки мобильного браузера в цвет нашей антрацитовой темы -->
    <meta name="theme-color" content="#1A1F2C">

    <!-- Внешние библиотеки стилей, шрифтов и анимаций -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <script src="https://code.iconify.design/1/1.0.4/iconify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/2.0.2/anime.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvasjs/1.7.0/canvasjs.min.js"></script>
    
    <!-- Название вкладки сайта -->
    <title>Лига Брасс</title>

    <script type="text/javascript">
      // Single Page Apps for GitHub Pages [1.22]
      // MIT License [1.22]
      // https://github.com/rafgraph/spa-github-pages [1.22]
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <noscript>Для работы этого приложения необходимо включить JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
